<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Cosita ❤️</title>
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <!-- AOS -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="Meli.css">
</head>

<body>
    <div class="stars"></div>
    <!-- Corazones -->
    <div class="hearts"></div>

    <!-- Header -->
    <header>
        <div>
            <h1 class="animate__animated animate__fadeInDown">Mi preciosa ❤️</h1>
            <p class="animate__animated animate__fadeInUp">No importa que estemos lejos, vos sabes que te amo y me
                encantas ✨</p>
        </div>
    </header>

    <section class="container my-5 gallery" data-aos="fade-up">
        <h2 class="text-center mb-5">Donde todo empezó y lo que más me gusta ver</h2>

        <!-- Imagen principal -->
        <div class="row justify-content-center mb-4 mt-4">
            <div class="col-10 col-md-6 text-center">
                <img src="img/Fotos/Nos conocimos.jpeg" class="img-fluid mb-2" alt="Nos conocimos">
                <p class="mt-2">El día en que todo comenzó ✨ <br> </p>
            </div>
        </div>

        <!-- Dos fotos lado a lado -->
        <div class="row justify-content-center g-3">
            <div class="col-6 col-md-3 text-center">
                <img src="img/Fotos/Hermosa.jpeg" class="img-fluid" alt="Foto 1">
            </div>
            <div class="col-6 col-md-3 text-center">
                <img src="img/Fotos/Me encanta.jpeg" class="img-fluid" alt="Foto 2">
            </div>
        </div>
    </section>


    <!-- Sorpresa -->
    <section class="container text-center my-5" data-aos="zoom-in">
        <h2>Un mensajito para vos 💌</h2>
        <button class="btn btn-light mt-3" onclick="mostrarSorpresa()">Haz clic aquí</button>
        <p id="sorpresa" class="mt-3" style="display:none; font-size:1.2rem;">Eres una mujer increible <br> Te amo con
            todo mi Corazón❤️</p>
    </section>

    <!-- Footer -->
    <footer class="text-center py-4">
        <p>
            Creado especialmente para vos <br>
            – Designed by (Tu Ingeniero)
        </p>
    </footer>

    <!-- Bootstrap / AOS / JS personalizado -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="kimi.js"></script>
</body>

</html>
